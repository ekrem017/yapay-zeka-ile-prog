<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | NeonAuth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080711;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .ambient-light-1 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(138, 43, 226, 0.35);
            border-radius: 50%;
            filter: blur(120px);
            top: 10%;
            left: 15%;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        .ambient-light-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(0, 210, 255, 0.25);
            border-radius: 50%;
            filter: blur(120px);
            bottom: 10%;
            right: 15%;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: rgba(18, 14, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 20px rgba(138, 43, 226, 0.2);
            transition: border-color 0.3s ease;
        }

        .auth-card:hover {
            border-color: rgba(0, 210, 255, 0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .auth-header p {
            color: #a0a5c0;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #c4c9e2;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        .error-message {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .btn-glow {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7b2cbf, #00d2ff);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8), 0 0 15px rgba(123, 44, 191, 0.6);
            transform: translateY(-2px);
        }

        .btn-glow:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #a0a5c0;
        }

        .auth-footer a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: all 0.3s ease;
        }

        .auth-footer a:hover {
            color: #9b51e0;
            text-shadow: 0 0 8px rgba(155, 81, 224, 0.6);
        }

        .alert-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .alert-box.success {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid #00e676;
            color: #00e676;
        }

        .alert-box.error {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }
    </style>
</head>
<body>
    <div class="ambient-light-1"></div>
    <div class="ambient-light-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Şifremi Unuttum</h2>
                <p>E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
            </div>

            <div id="alertBox" class="alert-box"></div>

            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="email">E-posta Adresi</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="ornek@mail.com">
                    </div>
                    <div class="error-message" id="emailError">Geçerli bir e-posta adresi giriniz.</div>
                </div>

                <button type="submit" class="btn-glow">Sıfırlama Bağlantısı Gönder</button>
            </form>

            <div class="auth-footer">
                <a href="index.html">← Giriş Sayfasına Dön</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const forgotForm = document.getElementById('forgotPasswordForm');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            const alertBox = document.getElementById('alertBox');

            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            forgotForm.addEventListener('submit', (e) => {
                e.preventDefault();
                let isValid = true;
                alertBox.style.display = 'none';
                emailError.style.display = 'none';

                if (!emailInput.value.trim()) {
                    emailError.textContent = 'E-posta alanı boş bırakılamaz.';
                    emailError.style.display = 'block';
                    isValid = false;
                } else if (!isValidEmail(emailInput.value.trim())) {
                    emailError.textContent = 'Geçerli bir e-posta adresi giriniz.';
                    emailError.style.display = 'block';
                    isValid = false;
                }

                if (isValid) {
                    alertBox.className = 'alert-box success';
                    alertBox.textContent = 'Şifre sıfırlama bağlantısı e-posta adresinize gönderildi!';
                    alertBox.style.display = 'block';
                    forgotForm.reset();
                }
            });
        });
    </script>
</body>
</html>
